<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060812"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#090c18"/>
    </linearGradient>
    <radialGradient id="g1" cx="25%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffb300" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="28%" r="70%">
      <stop offset="0" stop-color="#66e0ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#66e0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,.10)"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity=".75"/>

  <!-- BTC coin -->
  <g transform="translate(260 230)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="170" fill="rgba(255,179,0,.18)" stroke="rgba(255,179,0,.55)" stroke-width="2"/>
    <circle cx="0" cy="0" r="135" fill="rgba(0,0,0,.20)" stroke="rgba(255,255,255,.10)" stroke-width="2"/>
    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900">
      <text x="-48" y="28" font-size="120" fill="rgba(255,179,0,.92)">¿</text>
    </g>
    <path d="M-80,0 C-40,-70 40,-70 80,0 C40,70 -40,70 -80,0 Z" fill="rgba(255,179,0,.12)"/>
  </g>

  <!-- price line -->
  <path d="M140,720 C240,610 300,680 420,600 C520,540 600,610 720,520 C820,440 900,520 1040,430 C1160,355 1260,420 1410,310"
        fill="none" stroke="rgba(255,179,0,.9)" stroke-width="5" filter="url(#softGlow)"/>
  <path d="M140,720 C240,610 300,680 420,600 C520,540 600,610 720,520 C820,440 900,520 1040,430 C1160,355 1260,420 1410,310"
        fill="none" stroke="rgba(255,179,0,.22)" stroke-width="16"/>

  <!-- small candles -->
  <g opacity=".9" filter="url(#softGlow)" stroke-width="2">
    <g stroke="rgba(64,255,185,.95)" fill="rgba(64,255,185,.82)">
      <line x1="720" y1="390" x2="720" y2="520"/>
      <rect x="708" y="430" width="24" height="58" rx="6"/>
      <line x1="840" y1="350" x2="840" y2="500"/>
      <rect x="828" y="400" width="24" height="66" rx="6"/>
    </g>
    <g stroke="rgba(255,84,115,.95)" fill="rgba(255,84,115,.82)">
      <line x1="900" y1="330" x2="900" y2="540"/>
      <rect x="888" y="410" width="24" height="88" rx="6"/>
      <line x1="1020" y1="290" x2="1020" y2="470"/>
      <rect x="1008" y="350" width="24" height="82" rx="6"/>
    </g>
  </g>

  <!-- caption -->
  <g opacity=".82" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial">
    <text x="80" y="120" font-size="38" fill="rgba(255,255,255,.86)">Crypto Market</text>
    <text x="80" y="160" font-size="18" fill="rgba(255,255,255,.70)">Bitcoin / Volatility / Liquidity</text>
  </g>
</svg>
