<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071027"/>
      <stop offset="0.55" stop-color="#0b1635"/>
      <stop offset="1" stop-color="#090c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="20%" r="70%">
      <stop offset="0" stop-color="#00d0ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#00d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="30%" r="70%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,.035)" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".75"/>
  <rect width="1600" height="900" fill="url(#grid2)" opacity=".9"/>

  <!-- headline ticker chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" opacity=".85">
    <g transform="translate(70 90)">
      <rect x="0" y="0" width="240" height="44" rx="14" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.12)"/>
      <text x="18" y="28" fill="rgba(255,255,255,.85)">NASDAQ</text>
      <text x="120" y="28" fill="#66e0ff">+1.24%</text>
    </g>
    <g transform="translate(330 90)">
      <rect x="0" y="0" width="220" height="44" rx="14" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.12)"/>
      <text x="18" y="28" fill="rgba(255,255,255,.82)">VOL</text>
      <text x="90" y="28" fill="rgba(255,255,255,.75)">1.8B</text>
    </g>
    <g transform="translate(570 90)">
      <rect x="0" y="0" width="260" height="44" rx="14" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.12)"/>
      <text x="18" y="28" fill="rgba(255,255,255,.82)">ADV/DEC</text>
      <text x="150" y="28" fill="#a3ffea">1970/1120</text>
    </g>
  </g>

  <!-- main chart area -->
  <g transform="translate(70 170)">
    <rect x="0" y="0" width="1460" height="650" rx="28" fill="rgba(0,0,0,.18)" stroke="rgba(255,255,255,.12)"/>

    <!-- candlesticks -->
    <g filter="url(#softGlow)" opacity=".92">
      <g stroke-width="2.2">
        <!-- green -->
        <g stroke="rgba(64,255,185,.95)" fill="rgba(64,255,185,.85)">
          <line x1="120" y1="420" x2="120" y2="540"/>
          <rect x="108" y="450" width="24" height="56" rx="6"/>

          <line x1="240" y1="360" x2="240" y2="520"/>
          <rect x="228" y="400" width="24" height="72" rx="6"/>

          <line x1="360" y1="300" x2="360" y2="480"/>
          <rect x="348" y="350" width="24" height="78" rx="6"/>

          <line x1="720" y1="220" x2="720" y2="420"/>
          <rect x="708" y="270" width="24" height="86" rx="6"/>

          <line x1="960" y1="180" x2="960" y2="380"/>
          <rect x="948" y="240" width="24" height="86" rx="6"/>

          <line x1="1200" y1="150" x2="1200" y2="340"/>
          <rect x="1188" y="210" width="24" height="78" rx="6"/>
        </g>

        <!-- red -->
        <g stroke="rgba(255,84,115,.95)" fill="rgba(255,84,115,.82)">
          <line x1="180" y1="380" x2="180" y2="590"/>
          <rect x="168" y="460" width="24" height="82" rx="6"/>

          <line x1="480" y1="270" x2="480" y2="510"/>
          <rect x="468" y="340" width="24" height="96" rx="6"/>

          <line x1="600" y1="320" x2="600" y2="610"/>
          <rect x="588" y="420" width="24" height="110" rx="6"/>

          <line x1="840" y1="240" x2="840" y2="520"/>
          <rect x="828" y="330" width="24" height="108" rx="6"/>

          <line x1="1080" y1="210" x2="1080" y2="460"/>
          <rect x="1068" y="300" width="24" height="96" rx="6"/>

          <line x1="1320" y1="190" x2="1320" y2="410"/>
          <rect x="1308" y="260" width="24" height="90" rx="6"/>
        </g>
      </g>
    </g>

    <!-- line chart -->
    <path d="M80,520 C160,540 220,470 300,500 C380,530 430,450 520,470 C610,490 650,420 720,430 C800,440 880,360 980,380 C1060,395 1120,310 1200,320 C1280,330 1360,280 1420,250"
          fill="none" stroke="rgba(102,224,255,.88)" stroke-width="4" filter="url(#softGlow)"/>

    <!-- volume bars -->
    <g opacity=".55">
      <g fill="rgba(255,255,255,.20)">
        <rect x="90" y="610" width="18" height="22" rx="5"/>
        <rect x="130" y="600" width="18" height="32" rx="5"/>
        <rect x="170" y="618" width="18" height="14" rx="5"/>
        <rect x="210" y="595" width="18" height="37" rx="5"/>
        <rect x="250" y="605" width="18" height="27" rx="5"/>
        <rect x="290" y="590" width="18" height="42" rx="5"/>
        <rect x="330" y="610" width="18" height="22" rx="5"/>
        <rect x="370" y="600" width="18" height="32" rx="5"/>
        <rect x="410" y="618" width="18" height="14" rx="5"/>
        <rect x="450" y="595" width="18" height="37" rx="5"/>
        <rect x="490" y="605" width="18" height="27" rx="5"/>
        <rect x="530" y="590" width="18" height="42" rx="5"/>
        <rect x="570" y="610" width="18" height="22" rx="5"/>
        <rect x="610" y="600" width="18" height="32" rx="5"/>
        <rect x="650" y="618" width="18" height="14" rx="5"/>
        <rect x="690" y="595" width="18" height="37" rx="5"/>
        <rect x="730" y="605" width="18" height="27" rx="5"/>
      </g>
    </g>
  </g>
</svg>
